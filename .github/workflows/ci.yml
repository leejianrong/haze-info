name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check-budget
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run validate-data

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  lighthouse:
    # Reports mobile scores on the production build. Not a required check: runner timings vary.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: |
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173
          for i in 1 2 3; do
            npx lighthouse@12 http://localhost:4173/ --only-categories=performance,accessibility,best-practices --form-factor=mobile --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh$i.json --quiet
          done
          node -e "
          const runs=[1,2,3].map(i=>require('./lh'+i+'.json'));
          const med=a=>[...a].sort((x,y)=>x-y)[1];
          const score=(k)=>med(runs.map(r=>r.categories[k].score*100));
          const metric=(k)=>med(runs.map(r=>r.audits[k].numericValue));
          const perf=score('performance'),a11y=score('accessibility');
          console.log('Median of 3 mobile runs on a shared CI runner (no GPU)\n');
          console.log('| Metric | Value |\n|---|---|');
          console.log('| performance | '+Math.round(perf)+' (runs: '+runs.map(r=>Math.round(r.categories.performance.score*100)).join(', ')+') |');
          console.log('| accessibility | '+Math.round(a11y)+' |');
          console.log('| best-practices | '+Math.round(score('best-practices'))+' |');
          for(const k of ['first-contentful-paint','largest-contentful-paint','total-blocking-time']) console.log('| '+k+' | '+Math.round(metric(k))+' ms |');
          console.log('| cumulative-layout-shift | '+metric('cumulative-layout-shift').toFixed(3)+' |');
          if(perf<85||a11y<95){console.log('\nBelow target: performance >= 85 and accessibility >= 95');process.exit(1)}
          " | tee -a "$GITHUB_STEP_SUMMARY"
